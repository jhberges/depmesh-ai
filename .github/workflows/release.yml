name: Release

# Releases are cut by hand: go to the Actions tab, pick "Release", click
# "Run workflow", and enter the version (e.g. v0.3.0). The version is stamped
# into the binaries and becomes the tag + GitHub Release. Nothing is released
# automatically on push to main — see ci.yml for the per-commit gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.3.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + release and upload assets
    outputs:
      # The image job builds from the same commit at the same version, so it
      # needs the normalized value rather than re-deriving it from the input.
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Normalize version
        id: v
        run: |
          version="${{ github.event.inputs.version }}"
          [[ "$version" == v* ]] || version="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/jhberges/depmesh-ai/internal/gate.Version=${VERSION}"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"
            stage="build/${os}_${arch}"
            mkdir -p "$stage"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "$stage/depmesh-ai${ext}" ./cmd/depmesh-ai
            cp README.md "$stage/" || true
            # The archive name is a contract: scripts/install.sh and
            # scripts/install.ps1 both construct it literally and then look it
            # up in checksums.txt. Renaming it here breaks `curl | bash` for
            # every existing user — change all three together or not at all.
            archive="depmesh_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -qr "../../dist/${archive}.zip" .)
            else
              tar -C "$stage" -czf "dist/${archive}.tar.gz" .
            fi
          done
          # The installers are release assets too, so they can be curl'd
          # straight from the release page. They land in checksums.txt with
          # everything else, which is what lets a paranoid user verify the
          # script before piping it to a shell.
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum ./* > checksums.txt)
          ls -la dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --generate-notes \
            dist/*

  # The container image for `depmesh-ai api`, published to GHCR alongside the
  # tarballs. It runs after the release so a failed release never leaves a
  # published image pointing at a version nobody can download the source of.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A tool whose whole pitch is supply-chain integrity should be able to
          # answer "where did this image come from" about itself.
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # Keyless, against the workflow's OIDC identity — no key to store and
        # none to leak. Signing the digest rather than a tag is the point: tags
        # move, and a signature over a tag says nothing about what it points at.
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
