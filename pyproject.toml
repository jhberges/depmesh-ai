[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depmesh-ai"
version = "0.1.0"
description = "Vet open-source dependencies before adopting them — existence, health, and risk signals for humans and coding agents (MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas H. Berges" }]
# Deliberately zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
depmesh-ai = "depmesh_ai.cli:main"

[tool.setuptools.packages.find]
include = ["depmesh_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
