name: Release

# Releases are cut by hand: go to the Actions tab, pick "Release", click
# "Run workflow", and enter the version (e.g. v0.3.0). The version is stamped
# into the binaries and becomes the tag + GitHub Release. Nothing is released
# automatically on push to main — see ci.yml for the per-commit gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.3.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + release and upload assets
    outputs:
      # The image job builds from the same commit at the same version, so it
      # needs the normalized value rather than re-deriving it from the input.
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Normalize version
        id: v
        run: |
          version="${{ github.event.inputs.version }}"
          [[ "$version" == v* ]] || version="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/jhberges/depmesh-ai/internal/gate.Version=${VERSION}"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"
            stage="build/${os}_${arch}"
            mkdir -p "$stage"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "$stage/depmesh-ai${ext}" ./cmd/depmesh-ai
            cp README.md "$stage/" || true
            # The archive name is a contract: scripts/install.sh and
            # scripts/install.ps1 both construct it literally and then look it
            # up in checksums.txt. Renaming it here breaks `curl | bash` for
            # every existing user — change all three together or not at all.
            archive="depmesh_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -qr "../../dist/${archive}.zip" .)
            else
              tar -C "$stage" -czf "dist/${archive}.tar.gz" .
            fi
          done
          # The installers are release assets too, so they can be curl'd
          # straight from the release page. They land in checksums.txt with
          # everything else, which is what lets a paranoid user verify the
          # script before piping it to a shell.
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum ./* > checksums.txt)
          ls -la dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --generate-notes \
            dist/*

  # The container image for `depmesh-ai api`, published to GHCR alongside the
  # tarballs. It runs after the release so a failed release never leaves a
  # published image pointing at a version nobody can download the source of.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v4

      # No docker/* actions here, and no QEMU. The Dockerfile cross-compiles
      # with the Go toolchain (FROM --platform=$BUILDPLATFORM, GOARCH=$TARGETARCH),
      # so the arm64 image is a native build of a different target rather than an
      # emulated build — there is nothing for QEMU to do. The rest is the docker
      # CLI the runner already ships. Six marketplace actions is a lot of
      # unaudited third-party code to put in the release path of a tool that
      # sells itself on not enlarging your supply chain.
      - name: Build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          # Multi-platform output needs the docker-container driver; the
          # default docker driver can only load a single architecture.
          docker buildx create --use --name depmesh --driver docker-container

          # vX.Y.Z, the X.Y series tag, and latest. $VERSION is already
          # normalized to a leading "v" by the release job.
          series="${VERSION#v}"
          series="${series%.*}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${series}" \
            --tag "${IMAGE}:latest" \
            --provenance=true \
            --sbom=true \
            --metadata-file /tmp/build-metadata.json \
            --push .

          # The digest is what gets signed, so it has to come from the build
          # rather than from a later tag lookup — by then "latest" could point
          # somewhere else.
          digest="$(jq -er '."containerimage.digest"' /tmp/build-metadata.json)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Pinned by version *and* by hash. Fetching a "latest" installer to
      # establish provenance for a release would be assuming the thing we are
      # trying to prove. Same shape as scripts/install.sh's own download check.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          COSIGN_VERSION: v3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        # Keyless, against the workflow's OIDC identity — no key to store and
        # none to leak. Signing the digest rather than a tag is the point: tags
        # move, and a signature over a tag says nothing about what it points at.
        run: |
          set -euo pipefail
          curl -sSLo /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          chmod +x /tmp/cosign
          /tmp/cosign sign --yes "${IMAGE}@${DIGEST}"
